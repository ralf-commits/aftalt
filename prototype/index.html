<!doctype html>
<html lang="da">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aftalt</title>
<script>
// A strict allowlist selects presentation only; case data and actions stay shared.
if(new URLSearchParams(location.search).get('brand')==='dansk-haandvaerk'){
  document.documentElement.dataset.brand='dansk-haandvaerk';
  document.documentElement.dataset.theme='light';
  document.title='Dansk Håndværk · Digital sagsmappe';
}
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a presenter shell (top bar + stage) around a device frame; the app inside is rendered from one state and adapts to its container. */
/* Tokens from the Aftalt design system: puds (ground), tjære (ink), snor (brand blue), markering (orange = afventer), kvit (green = godkendt), stop (red). */
:root{
  --ground:#efede6; --surface:#ffffff; --surface2:#f7f6f1; --line:#dcd9cf; --line2:#bfbbae;
  --ink:#1c1a17; --ink2:#4f4c45; --ink3:#716d63;
  --accent:#1f3c8a; --accent-ink:#ffffff; --accent-soft:#e1e8fa;
  --good:#1e7a4a; --good-soft:#def1e5; --warn:#c84e0c; --warn-soft:#fbe9dd; --bad:#b3362a; --bad-soft:#f8e1dd;
  --shell:#e4e2da; --shellink:#1c1a17;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif; --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;
  --r:10px; --shadow:0 12px 32px rgba(28,26,23,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#141513; --surface:#1c1e1c; --surface2:#232624; --line:#313532; --line2:#434845;
  --ink:#edebe4; --ink2:#b8b5ac; --ink3:#8f8c82;
  --accent:#9db4f2; --accent-ink:#0f1a36; --accent-soft:#1c2a4f;
  --good:#5cc287; --good-soft:#163a26; --warn:#f0914f; --warn-soft:#3d2411; --bad:#e27c70; --bad-soft:#3f1e1a;
  --shell:#0c0e0d; --shellink:#edebe4; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --ground:#141513; --surface:#1c1e1c; --surface2:#232624; --line:#313532; --line2:#434845;
  --ink:#edebe4; --ink2:#b8b5ac; --ink3:#8f8c82;
  --accent:#9db4f2; --accent-ink:#0f1a36; --accent-soft:#1c2a4f;
  --good:#5cc287; --good-soft:#163a26; --warn:#f0914f; --warn-soft:#3d2411; --bad:#e27c70; --bad-soft:#3f1e1a;
  --shell:#0c0e0d; --shellink:#edebe4; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--shellink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- presenter shell ---------- */
.shell{min-height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--shell);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--shell)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{border:1px solid transparent;background:transparent;color:var(--ink2);padding:6px 10px;border-radius:999px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.step b{display:inline-flex;width:18px;height:18px;border-radius:999px;border:1.5px solid var(--line2);align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--ink3)}
.step.done b{background:var(--good);border-color:var(--good);color:#fff}
.step.active{background:var(--surface);border-color:var(--line);color:var(--ink)}
.step.active b{border-color:var(--accent);color:var(--accent)}
.step:hover{background:var(--surface)}
.spacer{flex-grow:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--ink);color:var(--ground)}
.clock{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px dashed var(--line2);border-radius:999px;font-variant-numeric:tabular-nums}
.clock i{width:7px;height:7px;border-radius:999px;background:var(--accent);display:inline-block}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500}
.ghost:hover{background:var(--surface);color:var(--ink)}
a.ghost{text-decoration:none;display:inline-flex;align-items:center}

.stage{flex-grow:1;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.scaler{transform-origin:top center;display:flex;gap:28px;align-items:flex-start}

/* ---------- device frames ---------- */
.frame{position:relative;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;container-type:inline-size;container-name:app}
.frame.mobile{width:390px;height:844px;border-radius:40px;border:8px solid #1E2120}
.frame.desktop{width:1180px;height:760px;border-radius:14px;border:1px solid var(--line)}
.phone{width:330px;height:680px;border-radius:34px;border:7px solid #1E2120;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative;container-type:inline-size;container-name:kunde}
.phone .lbl{position:absolute;left:0;right:0;top:0;text-align:center;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:8px;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}

/* ---------- app (inside frame) ---------- */
.app{height:100%;display:flex;background:var(--ground);color:var(--ink)}
.side{width:224px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px}
.side .logo{font-family:var(--display);font-weight:700;font-size:22px;padding:4px 10px 18px;letter-spacing:-.01em}
.navi{display:flex;flex-direction:column;gap:2px}
.navi a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:13.5px}
.navi a.on{background:var(--accent-soft);color:var(--accent)}
.navi a svg{width:16px;height:16px}
.side .firm{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.main{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.head{padding:18px 24px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.head .sub{font-size:12.5px;color:var(--ink3);margin-bottom:3px}
.tabs{display:flex;gap:6px}
.tab{font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;background:var(--surface2);color:var(--ink3);border:1px solid transparent}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.tab.done{color:var(--good);background:var(--good-soft)}
.body{flex-grow:1;overflow:auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:14px}
.foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@container app (min-width:700px){
  .cols{grid-template-columns:1.25fr 1fr}
  .body{padding:22px 28px 32px;gap:16px}
}
@container app (max-width:699px){
  .side{display:none}
  .head{padding:52px 20px 10px}
  .head h1{font-size:20px}
  .body{padding:16px 20px 24px}
}

/* ---------- components ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.card.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.card.locked{background:var(--surface2);border-style:dashed}
.card h3{margin:0;font-size:15px;font-weight:600;font-family:var(--body)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.muted{color:var(--ink3);font-size:12.5px}
.small{font-size:12.5px;color:var(--ink2);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--ink2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.icon{width:46px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.grow{flex-grow:1}
.btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field input{height:46px;padding:0 13px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px}
.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.list{display:flex;flex-direction:column;gap:7px;font-size:14px}
.list .it{display:flex;gap:10px;align-items:flex-start}
.list .it b{width:18px;flex-shrink:0;text-align:center}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ph{aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,var(--surface2),var(--line));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:5px;font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums;position:relative;max-width:100%}
.ph svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;color:var(--ink3)}
.ph.add{background:var(--surface);border:1px dashed var(--line2);cursor:pointer;color:var(--accent);font-weight:600;justify-content:center}
.ph.add:hover{background:var(--accent-soft)}
.note{display:flex;gap:9px;padding:10px 12px;background:var(--surface2);border-radius:9px;font-size:13px;line-height:1.45;color:var(--ink2)}
.note svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;color:var(--accent)}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl .ev:last-child{border-bottom:0}
.tl .t{font-size:12px;color:var(--ink3);line-height:1.4;font-variant-numeric:tabular-nums}
.tl .ev.flag{background:var(--warn-soft);margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:0}
.tl .ev.flag .t,.tl .ev.flag b,.tl .ev.flag span{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:var(--surface);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.stats span{font-size:11px;color:var(--ink3);text-align:center}
.dark{background:var(--ink);color:var(--ground)}
.dark .eyebrow{color:color-mix(in srgb,var(--ground) 65%,transparent)}
.lockbar{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--ground) 14%,transparent);font-size:12.5px;line-height:1.4}
.lockbar svg{width:14px;height:14px;flex-shrink:0;margin-top:2px}
.tick{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tick.on{background:var(--good);color:#fff}
.tick.off{border:1.5px solid var(--line2);color:transparent}
.price{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px;background:var(--surface2);border-radius:var(--r)}
.price b{font-family:var(--display);font-size:24px;font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.code{height:54px;font-size:22px;font-weight:600;letter-spacing:.14em;text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 24px;color:var(--ink3);height:100%}
.empty svg{width:28px;height:28px}
.sms{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--surface2);border-radius:14px 14px 14px 4px;font-size:13.5px;line-height:1.45;max-width:92%}
.sms .from{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.sms a{color:var(--accent);font-weight:600}
.kbody{height:100%;overflow:auto;padding:44px 18px 20px;display:flex;flex-direction:column;gap:14px;background:var(--surface);color:var(--ink)}
.kfoot{position:sticky;bottom:0;background:var(--surface);padding-top:10px;display:flex;flex-direction:column;gap:8px;margin-top:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,12,11,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.paper{background:#fff;color:#17191A;width:min(680px,100%);max-height:90%;overflow:auto;border-radius:6px;padding:40px 44px;font-family:var(--body);box-shadow:var(--shadow)}
.paper h2{font-family:var(--display);margin:0 0 4px;font-size:24px}
.paper .tl .ev{border-color:#E1DFD7}
.paper .tl .t{color:#7B807E}
.paper .pill{background:#F7F6F2;color:#4B4F4E}
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;line-height:16px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.stamp svg{width:13px;height:13px;flex-shrink:0}
.stamp.locked{color:var(--ink2)}
.tl .t{font-family:var(--mono);font-weight:500}
.ph span{font-family:var(--mono);font-weight:500}
.code{font-family:var(--mono)}
.clock{font-family:var(--mono)}
.mark{width:28px;height:28px;flex-shrink:0;display:inline-block}
.brand{align-items:center}
.mobileonly{display:none}
@container app (max-width:699px){.mobileonly{display:inline-flex}.deskonly{display:none}}
.switch{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3}
/* Whitelabel concept: existing palette tokens, pending official brand assets. */
.dhv-wordmark{display:flex;flex-direction:column;gap:4px;font-family:var(--body);font-weight:600;font-size:20px;line-height:1.05;letter-spacing:-.01em}
.dhv-wordmark small{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;line-height:1.4;color:inherit}
.tenant-kicker{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.tenant-customer{display:grid;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tenant-customer .dhv-wordmark{color:var(--accent)}
.tenant-customer + .muted svg{width:16px;height:16px;flex-shrink:0}
[data-brand="dansk-haandvaerk"] .kbody>*{flex-shrink:0}
[data-brand="dansk-haandvaerk"] .kfoot{position:static}
[data-brand="dansk-haandvaerk"] .phone.customer-mobile .kbody{padding-bottom:72px}
[data-brand="dansk-haandvaerk"] .it>b{white-space:nowrap}

:root[data-brand="dansk-haandvaerk"]{--ground:#f7f6f1;--shell:#efede6;--display:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;--r:4px}
[data-brand="dansk-haandvaerk"] .topbar{background:var(--surface);border-top:4px solid var(--accent);padding-block:16px;gap:16px}
[data-brand="dansk-haandvaerk"] .topbar>.brand{color:var(--accent);padding-right:24px;border-right:1px solid var(--line)}
[data-brand="dansk-haandvaerk"] .brand small{color:inherit}
[data-brand="dansk-haandvaerk"] .side{background:var(--accent);color:var(--accent-ink);border:0;padding:24px 16px}
[data-brand="dansk-haandvaerk"] .side .logo{padding:0 8px 32px}
[data-brand="dansk-haandvaerk"] .side .navi{gap:8px}
[data-brand="dansk-haandvaerk"] .side .navi a{color:var(--accent-ink);border-radius:4px;padding:12px 8px}
[data-brand="dansk-haandvaerk"] .side .navi a.on{background:var(--surface);color:var(--accent)}
[data-brand="dansk-haandvaerk"] .side .firm{background:var(--surface);color:var(--ink);border:0;border-radius:4px;padding:12px}
[data-brand="dansk-haandvaerk"] .head{padding-top:24px;padding-bottom:16px}
[data-brand="dansk-haandvaerk"] .card,[data-brand="dansk-haandvaerk"] .btn,[data-brand="dansk-haandvaerk"] input,[data-brand="dansk-haandvaerk"] .tab{border-radius:4px}
[data-brand="dansk-haandvaerk"] .frame.desktop{border-radius:10px;box-shadow:none}
[data-brand="dansk-haandvaerk"] .phone .lbl{background:var(--accent);color:var(--accent-ink)}
[data-brand="dansk-haandvaerk"] .paper .dhv-wordmark{color:var(--accent);margin-bottom:24px}
@media(max-width:600px){[data-brand="dansk-haandvaerk"] .topbar>.brand{border:0;padding-right:0}}
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="6" fill="#1f3c8a"/><path d="M10 29.5 19.5 39 38.5 11" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M25.5 29.5H36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>Aftalt <small>prototype</small></div>
    <nav class="steps" id="steps" aria-label="Forløb"></nav>
    <div class="spacer"></div>
    <div class="clock" id="clock" title="Simuleret tid i prototypen"><i></i><span></span></div>
    <div class="seg" role="group" aria-label="Enhed">
      <button type="button" id="devMobile" data-action="device" data-v="mobile">Mobil</button>
      <button type="button" id="devDesktop" data-action="device" data-v="desktop">Desktop</button>
    </div>
    <button type="button" class="ghost" data-action="reset">Nulstil</button>
    <a class="ghost back" href="../salgsside/index.html">Til salgssiden</a>
  </header>
  <main class="stage" id="stage">
    <div class="scaler" id="scaler">
      <div class="frame mobile" id="frame"><div class="app" id="app"></div></div>

function cpCard(c){
  const locked=cpLocked(c), done=cpDone(c);
  const state = done ? `<span class="pill ok">Dokumenteret ${fmtTime(c.fotos[0].t)}</span>` : locked ? `<span class="pill neutral">${I.lock} Låst</span>` : `<span class="pill warn">Mangler</span>`;
  const photos = c.fotos.map(f=>`<div class="ph">${I.camera}<span>${fmtTime(f.t)}</span></div>`).join('') +
    (locked ? '' : `<button type="button" class="ph add" data-action="foto" data-v="${c.id}" aria-label="Tag foto til ${c.navn}">${I.plus}</button>`);
  const needs = locked ? `<div class="lockbar" style="background:var(--surface);border:1px solid var(--line)">${I.lock}<span>Kan først dokumenteres, når ${(c.needs||[]).filter(id=>!cpDone(cp(id))).map(id=>`"${cp(id).navn}"`).join(' og ')} er på plads. Fotos af skjult arbejde kan ikke tages bagefter.</span></div>` : '';
  const note = c.note ? `<div class="note">${I.mic}<span>${c.note.text} <span class="muted">· talenote, skrevet ud ${fmtTime(c.note.t)}</span></span></div>`
    : (done && !locked ? `<button type="button" class="btn" style="height:40px;font-size:13.5px;align-self:flex-start" data-action="note" data-v="${c.id}">${I.mic} Indtal note</button>` : '');
  return `<div class="card ${done?'ok':locked?'locked':c.obl?'warn':''}">
    <div class="row between"><div><div class="eyebrow">${c.obl?'Obligatorisk checkpoint':'Checkpoint'}${c.ved?' · '+c.ved:''}</div><h3>${c.navn}</h3></div>${state}</div>
    ${needs}
    ${locked?'':`<div class="photos">${photos}</div>`}
    ${done?`<div class="stamp">${fmtDate(c.fotos[0].t)} · ${fmtTime(c.fotos[0].t)} · position bekræftet · ${c.fotos.length} foto${c.fotos.length>1?'s':''}</div>`:''}
    ${note}
  </div>`;
}
function tilCard(t){
  const st = t.status==='kladde'?`<span class="pill neutral">Kladde</span>`:t.status==='sendt'?`<span class="pill warn">Sendt ${fmtTime(t.sentAt)} · afventer</span>`:`<span class="pill ok">Godkendt ${fmtTime(t.okAt)}</span>`;
  const act = t.status==='kladde'?`<button type="button" class="btn primary" style="height:40px;font-size:13.5px;align-self:flex-start" data-action="sendTil" data-v="${t.id}">Send til kunden</button>`
    : t.status==='sendt'?`<div class="small">Arbejdet på tillægget er sat på pause, indtil kunden har godkendt.</div><button type="button" class="btn mobileonly" style="height:40px;font-size:13.5px;align-self:flex-start" data-action="kunde">Vis kundens telefon</button>`
    : `<div class="stamp locked">${I.lock}${fmtDate(t.okAt)} · ${fmtTime(t.okAt)} · SMS-kode · låst</div><div class="small">Arbejdet fortsat ${fmtTime(new Date(t.okAt.getTime()+3*60000))}, efter godkendelsen. Loggen viser rækkefølgen.</div>`;
  return `<div class="card ${t.status==='godkendt'?'ok':''}"><div class="row between"><div><div class="eyebrow">Tillæg · ${fmtTime(t.at)}</div><h3>${t.titel}</h3></div>${st}</div>
    <div class="small">Maks. ${kr(t.loft)} DKK inkl. moms · ${t.fotos} foto · godkendes af kunden via SMS-kode</div>${act}</div>`;
}
function scrByggedag(){

      </div>
    </div>`,
    actions:`<button type="button" class="btn icon" aria-label="Tag foto" data-action="fotoNext">${I.camera}</button><button type="button" class="btn primary grow" data-action="go" data-v="aflevering" ${oblDone?'':'disabled'}>${oblDone?'Gå til aflevering':'Aflevering låst: obligatoriske fotos mangler'}</button>`
  };
}

function scrAflevering(){
  const k=S.kvit;
  const mangler = S.mangler.length ? S.mangler.map(m=>`<div class="card ${m.udbedret?'ok':'warn'}"><div class="row between"><span class="eyebrow">Mangel</span>${m.udbedret?`<span class="pill ok">Udbedret ${fmtDay(m.udbedretAt)}</span>`:`<span class="pill warn">Frist ${fmtDay(m.frist)}</span>`}</div>
      <h3>${m.titel}</h3><div class="small">Noteret sammen med kunden · 1 foto · rettes uden beregning${m.udbedret?' · kunde kvitteret samme dag':''}</div>
      ${m.udbedret||k.status!=='kvitteret'?'':`<button type="button" class="btn" style="height:40px;font-size:13.5px;align-self:flex-start" data-action="udbedr" data-v="${m.id}">Markér udbedret (+ foto)</button>`}</div>`).join('')
    : `<div class="card"><span class="eyebrow">Mangler</span><div class="small">Ingen mangler noteret.</div>${k.status==='ingen'?`<button type="button" class="btn" style="height:40px;font-size:13.5px;align-self:flex-start" data-action="nyMangel">${I.plus} Notér mangel</button>`:''}</div>`;
  const kv = k.status==='kvitteret' ? `<div class="card ok"><div class="row"><div class="tick on" style="width:36px;height:36px;border-radius:999px">${I.check}</div><div><div style="font-weight:600">Kvitteret af ${S.sag.kunde}</div><div class="stamp locked">${I.lock}${fmtDate(k.at)} · ${fmtTime(k.at)} · SMS-kode · låst</div><div class="small">"Afleveret${S.mangler.length?` med ${S.mangler.length} mangel, frist aftalt`:' uden mangler'}"</div></div></div></div>`
    : k.status==='sendt' ? `<div class="card warn"><span class="eyebrow">Kundens kvittering</span><div class="pill warn">Sendt ${fmtTime(k.sentAt)} · afventer</div><button type="button" class="btn mobileonly" style="height:40px;font-size:13.5px;align-self:flex-start" data-action="kunde">Vis kundens telefon</button></div>`
    : `<div class="card"><span class="eyebrow">Kundens kvittering</span><div class="small">Kunden kvitterer for afleveringen og eventuelle mangler via SMS-link. Kvitteringen er starten på garantiperioden.</div></div>`;
  const actions = k.status==='ingen' ? `<button type="button" class="btn primary grow" data-action="sendKvit">Send aflevering til kundens kvittering</button>`
    : k.status==='sendt' ? `<button type="button" class="btn grow deskonly" disabled>Afventer kundens kvittering</button><button type="button" class="btn grow mobileonly" data-action="kunde">Vis kundens telefon</button>`
    : `<button type="button" class="btn primary grow" data-action="go" data-v="sagsmappe">${I.folder} Afslut og gem sagsmappe</button>`;
  return {
    title:`Aflevering · ${WD[F().aflevering.getDay()]} ${fmtDay(F().aflevering)}`, sub:`${S.sag.adresse.split(',')[0]} · Sag ${S.sag.nr}`,
    body:`<div class="cols">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card"><span class="eyebrow">Tjekliste · ${S.sag.fag.toLowerCase()}</span><div class="list">
          ${S.cps.map(c=>`<div class="it" style="align-items:center"><span class="tick ${cpDone(c)?'on':'off'}">✓</span><span style="flex-grow:1">${c.navn}</span><span class="muted">${cpDone(c)?c.fotos.length+' foto'+(c.fotos.length>1?'s':''):'mangler'}</span></div>`).join('')}
          <div class="it" style="align-items:center"><span class="tick on">✓</span><span style="flex-grow:1">Materialer registreret</span><span class="muted">2 bilag</span></div>
        </div></div>
        ${mangler}
      </div>
      <div style="display:flex;flex-direction:column;gap:14px">${kv}
        <div class="card"><span class="eyebrow">Herefter</span><p class="small" style="margin:0">Sagsmappen gemmes i 10 år. Kunden får sin egen kopi med fotos, aftale og tillæg, som følger huset ved salg.</p></div></div>
    </div>`, actions };
}

function evRow(e,flag){ return `<div class="ev ${flag?'flag':''}"><div class="t">${fmtDay(e.t)}${e.t.getFullYear()!==2026?' '+e.t.getFullYear():''}<br>${fmtTime(e.t)}</div><div><b style="font-size:13px">${e.title}</b><br><span class="small">${e.detail}</span></div></div>`; }
function scrSagsmappe(){
  const godk=S.events.filter(e=>e.kind==='godk').length, til=S.tillaeg.filter(t=>t.status==='godkendt').length, mg=S.mangler.length;
  const banner = S.klage ? `<div class="lockbar">${I.lock}<span>Åbnet ${fmtDate(S.klage.open)} ved klage · samtykke fra Tømrerfirma Holm ${fmtDay(S.klage.consent)} · adgang logget</span></div>`
    : `<div class="lockbar">${I.lock}<span>Lukket sagsmappe. Kun håndværker og kunde har adgang. Foreningen får adgang ved en klage, med samtykke.</span></div>`;
  return {
    title:`Sag ${S.sag.nr} · ${S.sag.adresse.split(',')[0]}`, sub:`Sagsmappe · Tømrerfirma Holm ApS · ${S.sag.fag} · afleveret ${S.kvit.at?fmtDate(S.kvit.at):'(ikke afleveret)'}`,
    body:`<div class="card dark"><div class="eyebrow">Dansk Håndværk · Garantiordning · ${S.klage?'foreningens visning':'arkiv'}</div>${banner}</div>
    <div class="stats"><div><b>${godk}</b><span>godkendelser fra kunde</span></div><div><b>${til}</b><span>tillæg</span></div><div><b>${fotoCount()}</b><span>fotos, tidsstemplet</span></div><div><b>${mg}</b><span>mangel${mg===1?'':'er'}${S.mangler.every(m=>m.udbedret)&&mg?', lukket':''}</span></div></div>
    <div class="cols">
      <div class="card"><span class="eyebrow">Kronologi · alle tidsstempler låst ved registrering</span>
        <div class="tl">${S.events.map(e=>evRow(e,e.kind==='klage')).join('')}${S.events.length?'':'<div class="small">Ingen hændelser endnu.</div>'}</div></div>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="card"><span class="eyebrow">Det nævnet beder om</span><div class="list">
          <div class="it"><span class="tick ${S.aftale.status==='godkendt'?'on':'off'}">✓</span><span>Aftalegrundlag: hvad var med, godkendt af kunden</span></div>
          <div class="it"><span class="tick ${S.tillaeg.length&&S.tillaeg.every(t=>t.status==='godkendt')?'on':'off'}">✓</span><span>Ekstraarbejde godkendt før udførelse</span></div>
          <div class="it"><span class="tick ${S.cps.filter(c=>c.obl).every(cpDone)?'on':'off'}">✓</span><span>Skjult arbejde fotograferet før lukning</span></div>
          <div class="it"><span class="tick ${S.kvit.status==='kvitteret'?'on':'off'}">✓</span><span>Aflevering og mangler kvitteret af kunden</span></div></div></div>
        ${S.klage?'':`<div class="card"><span class="eyebrow">Demo</span><p class="small" style="margin:0">Spol 18 måneder frem og se, hvad foreningen får, når der kommer ${F().klage.demo}.</p><button type="button" class="btn" style="align-self:flex-start" data-action="klage">Simulér klage i 2028</button></div>`}
      </div>
    </div>`,
    actions:`<button type="button" class="btn primary grow" data-action="pdf">${I.file} Vis sagsmappe som PDF</button><button type="button" class="btn deskonly" data-action="reset">Start forfra</button>`
  };
}
const SCREENS={sag:scrSag,aftale:scrAftale,byggedag:scrByggedag,aflevering:scrAflevering,sagsmappe:scrSagsmappe};

/* ---------- kunde (SMS-link) ---------- */
function renderKunde(){
  const p=pending(), el=document.getElementById('kunde');
  const head=`${isMemberBrand?`<div class="tenant-customer">${BRAND.wordmark}<span class="small">En service til medlemmer og deres kunder</span></div>`:''}<div class="muted" style="display:flex;gap:6px;align-items:center">${I.lock}<span>${BRAND.customerHeading}</span></div>`;
  if(p==='aftale'){
    el.innerHTML=`${head}<div><div class="eyebrow">Tømrerfirma Holm ApS</div><h2 style="font-family:var(--display);margin:4px 0 0;font-size:21px;line-height:1.2">Godkend aftalen for ${S.sag.adresse.split(',')[0]}</h2></div>
    <div class="price"><span class="small">Samlet pris</span><b>${kr(S.aftale.pris)}</b></div><div class="muted" style="margin-top:-8px">DKK inkl. moms · 30 % ved start, 40 % midtvejs, 30 % ved aflevering</div>
    <div class="two"><div class="card" style="padding:12px"><span class="eyebrow" style="color:var(--good)">Med</span><div class="list" style="font-size:13px">${F().kMed.map(x=>`<span>${x}</span>`).join('')}</div></div>
    <div class="card" style="padding:12px"><span class="eyebrow" style="color:var(--bad)">Ikke med</span><div class="list" style="font-size:13px">${F().kIkke.map(x=>`<span>${x}</span>`).join('')}</div></div></div>
    <p class="small" style="margin:0">Se <a href="#" data-action="noop" style="color:var(--accent);font-weight:600">tilbuddet (PDF) og vilkårene</a>. Ændringer undervejs sendes som tillæg, som du godkender på samme måde.</p>
    <div class="kfoot"><div class="field"><label for="k-kode">Kode fra SMS</label><input id="k-kode" class="code" value="482 917"></div>
    <button type="button" class="btn primary" data-action="okAftale">Godkend aftalen</button><div class="muted" style="text-align:center">Aftalen låses og tidsstemples. Du får en kopi på SMS.</div></div>`;
  } else if(p==='tillaeg'){
    const t=S.tillaeg.find(x=>x.status==='sendt');
    el.innerHTML=`${head}<div><div class="eyebrow">Tømrerfirma Holm ApS · tillæg til aftalen</div><h2 style="font-family:var(--display);margin:4px 0 0;font-size:21px;line-height:1.2">${t.titel}</h2></div>
    <div class="card"><div class="photos"><div class="ph">${I.camera}<span>${fmtTime(t.at)}</span></div></div><div class="small">Fundet ${fmtDay(t.at)} ${fmtTime(t.at)} under arbejdet. Ikke en del af den godkendte aftale.</div></div>
    <div class="price"><span class="small">Prisloft</span><b>maks. ${kr(t.loft)}</b></div><div class="muted" style="margin-top:-8px">DKK inkl. moms · du betaler kun for det, der faktisk udføres</div>
    <p class="small" style="margin:0">Arbejdet er sat på pause, indtil du godkender. Den oprindelige aftale ændres ikke.</p>
    <div class="kfoot"><div class="field"><label for="k-kode2">Kode fra SMS</label><input id="k-kode2" class="code" value="306 118"></div>
    <button type="button" class="btn primary" data-action="okTil" data-v="${t.id}">Godkend tillægget</button><button type="button" class="btn" data-action="noop">Ring til mester</button></div>`;
  } else if(p==='kvit'){
    el.innerHTML=`${head}<div><div class="eyebrow">Tømrerfirma Holm ApS</div><h2 style="font-family:var(--display);margin:4px 0 0;font-size:21px;line-height:1.2">Kvittér for afleveringen</h2></div>
    <div class="card"><span class="eyebrow">Gennemgået sammen</span><div class="list" style="font-size:13px">${S.cps.map(c=>`<div class="it"><span class="tick ${cpDone(c)?'on':'off'}">✓</span><span>${c.navn}</span></div>`).join('')}</div></div>
    ${S.mangler.map(m=>`<div class="card warn"><span class="eyebrow">Mangel · rettes uden beregning</span><b>${m.titel}</b><div class="small">Frist ${fmtDay(m.frist)}. Du får besked, når den er rettet.</div></div>`).join('')}
    <p class="small" style="margin:0">Din kvittering starter garantiperioden. Du får sagsmappen med alle fotos, aftale og tillæg på SMS.</p>
    <div class="kfoot"><div class="field"><label for="k-kode3">Kode fra SMS</label><input id="k-kode3" class="code" value="771 240"></div>
    <button type="button" class="btn primary" data-action="okKvit">Kvittér for aflevering</button></div>`;
  } else {
    const last = S.kvit.status==='kvitteret' ? `<div class="sms"><div class="from">${BRAND.name} · Tømrerfirma Holm</div>Tak, ${S.sag.kunde.split(' ')[0]}. Din kvittering er modtaget ${fmtTime(S.kvit.at)}. Her er din sagsmappe for ${S.sag.adresse.split(',')[0]}: <a href="#" data-action="noop">${BRAND.receiptLabel}</a> (gemmes i 10 år).</div>`
      : S.aftale.status==='godkendt' ? `<div class="sms"><div class="from">${BRAND.name} · Tømrerfirma Holm</div>Aftalen for ${S.sag.adresse.split(',')[0]} er godkendt ${fmtDay(S.aftale.okAt)} ${fmtTime(S.aftale.okAt)} og låst. Din kopi: <a href="#" data-action="noop">${BRAND.agreementLabel}</a></div>`
      : '';
    el.innerHTML=`${head}<div class="empty" style="height:auto;padding:28px 10px 10px">${I.inbox}<div><b>Ingen afventende godkendelser</b><div class="muted">Kunden får en SMS, når der er noget at tage stilling til.</div></div></div>${last}`;
  }
}

/* ---------- render ---------- */
function render(){
  const frame=document.getElementById('frame'), app=document.getElementById('app'), phone=document.getElementById('phone');
  frame.className='frame '+S.device;
  const sc=SCREENS[S.screen]();
  const tabs=STEPS.slice(1,4).map(([k,l])=>`<span class="tab ${S.screen===k?'on':stepDone[k]()?'done':''}">${l}</span>`).join('');
  const nav=`<nav class="side"><div class="logo" style="display:flex;align-items:center;gap:10px">${BRAND.wordmark}</div><div class="navi">
    <a href="#" class="${S.screen==='sag'?'on':''}" data-action="go" data-v="sag">${I.plus} Ny sag</a>
    <a href="#" class="${['aftale','byggedag','aflevering'].includes(S.screen)?'on':''}" data-action="go" data-v="${S.sag.created?(S.aftale.status==='godkendt'?'byggedag':'aftale'):'sag'}">${I.home} Sager · 1 aktiv</a>
    <a href="#" class="${S.screen==='sagsmappe'?'on':''}" data-action="go" data-v="sagsmappe">${I.folder} Sagsmapper</a>
    <a href="#" data-action="noop">${I.list} Tjeklister</a></div>
    <div class="firm"><div class="tick on" style="width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--ground);font-size:12px">TH</div><div style="min-width:0"><div style="font-weight:600;font-size:13px">Tømrerfirma Holm</div><div class="muted" style="font-size:11.5px">Dansk Håndværk · medlem</div></div></div></nav>`;
  app.innerHTML=`${nav}<div class="main"><div class="head"><div>${isMemberBrand?'<div class="tenant-kicker">Dansk Håndværk · medlemssystem</div>':''}<div class="sub">${sc.sub||''}</div><h1>${sc.title}</h1></div><div class="tabs">${tabs}</div></div>
    <div class="body">${sc.body}</div><div class="foot">${sc.actions}</div></div>`;
  renderKunde();
  // customer phone: desktop shows beside; mobile swaps
  const mobileKunde = S.device==='mobile' && S.showKunde;
  phone.classList.toggle('customer-mobile',mobileKunde);
  phone.hidden = S.device==='mobile' ? !mobileKunde : false;
  frame.hidden = mobileKunde;
  phone.querySelector('.switch')?.remove();
  if(mobileKunde){ phone.insertAdjacentHTML('beforeend',`<button type="button" class="btn switch" style="height:40px;font-size:13px" data-action="kundeBack">Tilbage til håndværkerens telefon</button>`); }
  // steps + clock + device
  document.getElementById('steps').innerHTML=STEPS.map(([k,l],i)=>`<button type="button" class="step ${S.screen===k?'active':''} ${stepDone[k]()?'done':''}" data-action="go" data-v="${k}"><b>${stepDone[k]()?'✓':i+1}</b>${l}</button>`).join('');
  document.querySelector('#clock span').textContent=`${WD[S.clock.getDay()]} ${fmtDate(S.clock)} · ${fmtTime(S.clock)}`;
  document.getElementById('devMobile').classList.toggle('on',S.device==='mobile');
  document.getElementById('devDesktop').classList.toggle('on',S.device==='desktop');
  fit();
}
function fit(){
  const stage=document.getElementById('stage'), sc=document.getElementById('scaler');
  sc.style.transform='none';
  const w=sc.scrollWidth, avail=stage.clientWidth-8;
  const k=Math.min(1,avail/w);
  sc.style.transform=`scale(${k})`;
  stage.style.height = k<1 ? (sc.offsetHeight*k+72)+'px' : '';
}
window.addEventListener('resize',fit);

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove('show'),2600); }
function showPdf(){
  const host=document.getElementById('modalHost');
  host.innerHTML=`<div class="modal" data-action="closeModal"><div class="paper" role="dialog" aria-label="Sagsmappe som PDF">${isMemberBrand?BRAND.wordmark:''}<div class="row between" style="margin-bottom:18px"><div><div class="eyebrow">Sagsmappe · tidsstemplet udskrift</div><h2>Sag ${S.sag.nr} · ${S.sag.adresse}</h2><div class="small">Tømrerfirma Holm ApS · kunde ${S.sag.kunde} · ${S.sag.fag} · genereret ${fmtDate(S.clock)} ${fmtTime(S.clock)}</div></div><span class="pill">${fotoCount()} fotos</span></div>
  <div class="tl">${S.events.map(e=>evRow(e,false)).join('')}</div>
  <p class="small" style="margin:20px 0 0;color:#7B807E">Alle hændelser er registreret med tid, bruger og, hvor relevant, position. Fotos ligger som bilag i fuld opløsning. I den rigtige version er dokumentet kryptografisk signeret.</p>
  <div class="row" style="margin-top:20px;justify-content:flex-end"><button type="button" class="btn" data-action="closeModal">Luk</button></div></div></div>`;
}

/* ---------- actions ---------- */
function enter(screen){
  if(screen==='byggedag' && !S.stageDates.byggedag){ S.stageDates.byggedag=true; S.clock=new Date(DAYS.byggedag); log('ind','Tjekket ind på adressen','Position bekræftet · '+S.sag.adresse.split(',')[0]); }
  if(screen==='aflevering' && !S.stageDates.aflevering){ S.stageDates.aflevering=true; S.clock=new Date(F().aflevering); }
  S.screen=screen; S.showKunde=false;
}
const A={
  device(v){ S.device=v; S.showKunde=false; },
  reset(){ S=fresh(); toast('Prototypen er nulstillet'); },
  go(v){ if(v!=='sag' && !S.sag.created){ toast('Opret sagen først'); S.screen='sag'; return; } enter(v); },
  fag(v){ if(S.sag.created){ toast('Fagtypen er låst. Start forfra for at skifte.'); return; } const f=FAG[v]||FAG['Vådrum']; S.sag.fag=v; S.sag.nr=f.nr; S.aftale.pris=f.pris; S.cps=mkCps(FAG[v]?v:'Vådrum'); },
  opret(){ S.sag.created=true; log('sag','Sag oprettet','Adresse, kunde og fagtype registreret af Tømrerfirma Holm'); tick(2); enter('aftale'); toast('Sagen er oprettet. Tilbuddet er hentet fra Dinero.'); },
  sendAftale(){ tick(5); S.aftale.status='sendt'; S.aftale.sentAt=new Date(S.clock); log('send','Aftale sendt til kunde','SMS-link til '+S.sag.mobil+' · '+kr(S.aftale.pris)+' DKK · med og ikke med'); if(S.device==='mobile'){ S.showKunde=true; } toast('SMS sendt til '+S.sag.kunde); },
  kunde(){ S.showKunde=true; }, kundeBack(){ S.showKunde=false; },
  okAftale(){ tick(323); S.aftale.status='godkendt'; S.aftale.okAt=new Date(S.clock); log('godk','Aftale godkendt af kunde','SMS-kode · '+kr(S.aftale.pris)+' DKK · med og ikke med låst'); S.showKunde=false; toast('Aftalen er godkendt og låst'); },
  foto(v){ const c=cp(v); if(cpLocked(c)) return; tick(c.fotos.length?2:9); c.fotos.push({t:new Date(S.clock)}); const d=(c.obl?'Obligatorisk · ':'')+c.fotos.length+(c.fotos.length>1?' fotos':' foto')+' · position bekræftet'+(c.ved?' · '+c.ved:'')+(c.note?' · talenote':''); const ev=S.events.find(e=>e.title==='Checkpoint: '+c.navn); if(ev) ev.detail=d; else log('cp','Checkpoint: '+c.navn,d); },
  fotoNext(){ const c=S.cps.find(x=>!cpDone(x)&&!cpLocked(x)); if(!c){ toast('Alle checkpoints er dokumenteret'); return; } A.foto(c.id); toast('Foto gemt under "'+c.navn+'"'); },
  note(v){ const c=cp(v); tick(1); c.note={text:F().notes[v]||'Note indtalt.',t:new Date(S.clock)}; S.events.filter(e=>e.title==='Checkpoint: '+c.navn).forEach(e=>e.detail+=' · talenote'); toast('Talenote skrevet ud'); },
  nytTil(){ S.draft={...F().tillaeg}; },
  dropTil(){ S.draft=null; },
  gemTil(){ tick(14); const t={id:'t'+Date.now(),titel:S.draft.titel,loft:Number(String(S.draft.loft).replace(/\D/g,''))||0,fotos:1,status:'sendt',at:new Date(S.clock),sentAt:new Date(S.clock),okAt:null}; S.tillaeg.push(t); S.draft=null; log('send','Tillæg sendt til kunde',t.titel+' · maks. '+kr(t.loft)+' DKK · 1 foto · arbejdet sat på pause'); if(S.device==='mobile') S.showKunde=true; toast('Tillæg sendt til '+S.sag.kunde); },
  sendTil(v){ const t=S.tillaeg.find(x=>x.id===v); tick(3); t.status='sendt'; t.sentAt=new Date(S.clock); log('send','Tillæg sendt til kunde',t.titel+' · maks. '+kr(t.loft)+' DKK'); if(S.device==='mobile') S.showKunde=true; },
  okTil(v){ const t=S.tillaeg.find(x=>x.id===v); tick(22); t.status='godkendt'; t.okAt=new Date(S.clock); log('godk','Tillæg godkendt: '+t.titel,'SMS-kode · maks. '+kr(t.loft)+' DKK · arbejde fortsat '+fmtTime(new Date(S.clock.getTime()+3*60000))); S.showKunde=false; toast('Tillægget er godkendt. Arbejdet kan fortsætte.'); },
  nyMangel(){ tick(6); S.mangler.push({id:'m'+Date.now(),titel:F().mangel,frist:new Date(F().frist),udbedret:false}); toast('Mangel noteret med frist'); },
  sendKvit(){ tick(8); S.kvit.status='sendt'; S.kvit.sentAt=new Date(S.clock); log('send','Aflevering sendt til kundens kvittering','Tjekliste '+S.cps.filter(cpDone).length+'/'+S.cps.length+(S.mangler.length?' · '+S.mangler.length+' mangel, frist '+fmtDay(S.mangler[0].frist):' · ingen mangler')); if(S.device==='mobile') S.showKunde=true; toast('SMS sendt til '+S.sag.kunde); },
  okKvit(){ tick(22); S.kvit.status='kvitteret'; S.kvit.at=new Date(S.clock); log('godk','Aflevering kvitteret af kunde','SMS-kode · garantiperioden starter'+(S.mangler.length?' · '+S.mangler.length+' mangel, frist '+fmtDay(S.mangler[0].frist):'')); S.showKunde=false; toast('Kunden har kvitteret'); },
  udbedr(v){ const m=S.mangler.find(x=>x.id===v); S.clock=new Date(m.frist.getTime()+13*3600000+5*60000); m.udbedret=true; m.udbedretAt=new Date(S.clock); log('cp','Mangel udbedret: '+m.titel,'1 foto · kunde kvitteret samme dag'); toast('Mangel lukket med foto'); },
  klage(){ S.clock=new Date(2028,4,2,9,40); log('klage',F().klage.titel,'Modtaget fra kunde · firmaets svar 4. maj · sag sendt til foreningen 13. maj'); S.klage={open:new Date(2028,4,14,10,0),consent:new Date(2028,4,13)}; S.clock=new Date(2028,4,14,10,0); toast('18 måneder senere: foreningen åbner sagsmappen'); },
  pdf(){ showPdf(); return 'nomodalrender'; },
  closeModal(){ document.getElementById('modalHost').innerHTML=''; return 'noRender'; },
  noop(){ toast('Ikke med i prototypen'); return 'noRender'; }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  if(el.classList.contains('modal') && e.target!==el) return;
  e.preventDefault();
  const r=A[el.dataset.action]?.(el.dataset.v);
  if(r!=='noRender') render();
});
document.addEventListener('input',e=>{
  const b=e.target.dataset.bind; if(!b) return;
  if(b.startsWith('draft')) S.draft[b==='draftTitel'?'titel':'loft']=e.target.value; else S.sag[b]=e.target.value;
});
S=fresh(); render();
})();
</script>
